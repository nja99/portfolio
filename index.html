    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />

    <!--
      Theme bootstrap. Runs BEFORE React loads so the page never flashes the
      wrong theme. It must use the same storage key as src/services/ThemeService.js.
    -->
    <script>
      (function () {
        try {
          var hash = location.hash.toLowerCase();
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var start = document.documentElement.getAttribute('data-start-theme');
          if (hash === '#dark' || (hash !== '#light' && (start === 'dark' || (!start && (saved === 'dark' || (!saved && prefersDark)))))) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
